# Copies the website's research queue into the repository once a day (tools/queue.json), so the daily research
# routine (ROUTINE.md) can read it from GitHub. "[CI Skip]" stops Cloudflare rebuilding the site for this commit.
name: research-queue
on:
  schedule:
    - cron: "40 2 * * *"      # 02:40 UTC, before the routine at 03:10 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the queue
        run: |
          curl -fsS https://companyresearch.io/api/queue -o tools/queue.json.new
          python3 -c "import json; json.load(open('tools/queue.json.new'))"
          mv tools/queue.json.new tools/queue.json
      - name: Commit if it changed
        run: |
          git add tools/queue.json
          if git diff --cached --quiet; then echo "queue unchanged"; exit 0; fi
          git -c user.name="research-queue" -c user.email="actions@users.noreply.github.com" commit -m "Research queue $(date -u +%F) [CI Skip]"
          git push
